# Standard workflow config of chatmail/workflow's py-checks flow.

name: CI

on:
  push:
    branches: [ main ]
    tags-ignore: [ '**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  py-checks:
    uses: chatmail/workflows/.github/workflows/py-checks.yml@main
